<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="探索18个职业方向，了解职责与岗位。">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231b1d16'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='14' fill='%23ece5d2' text-anchor='middle'%3EJP%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/explore.css">
  <title>探索 18 个方向 · JobPath</title>
</head>
<body class="explore-body">
  <header class="explore-bar">
    <a class="brand" href="/" aria-label="启职 JobPath 首页">
      <span class="brand-mark">JP</span>
      <span class="brand-text"><strong>启职</strong><small>JobPath</small></span>
    </a>
    <div class="explore-context">
      <span class="eyebrow">职业探索</span>
      <strong>18 个方向</strong>
    </div>
    <label class="explore-search">
      <span class="sr-only">搜索方向或技能</span>
      <input id="explore-search" type="search" autocomplete="off" placeholder="搜索方向、技能或关键词">
      <kbd>/</kbd>
    </label>
    <div class="explore-tools">

      <a class="btn btn-ghost btn-sm" href="/">返回工作台 ↗</a>
    </div>
  </header>

  <main class="explore-main">
    <section class="explore-side">
      <div class="explore-intro">
        <p class="eyebrow"></p>
        <h1>先看看，<br><span class="mark">你可能去哪</span>。</h1>
        <p class="lede">了解不同方向的工作内容，找到适合自己的下一步。</p>
        <p class="explore-hint"><span class="lede-dot"></span> 选择方向，查看岗位</p>
      </div>
      <section id="category-detail" class="category-detail" aria-live="polite">
        <p class="eyebrow">选择方向</p>
        <h2>从感兴趣的方向开始</h2>
        <p class="category-copy">这里会显示方向的职责、能力关键词，以及当前目录里可核验的岗位数量。</p>
      </section>
    </section>

    <section class="orb-stage" aria-label="职业方向">
      <div id="explore-list" class="explore-list"></div>
    </section>
  </main>

  <noscript><p class="explore-noscript">请启用 JavaScript 以浏览和收藏岗位。</p></noscript>
  <script type="module" src="/src/explore.js"></script>
</body>
</html>
